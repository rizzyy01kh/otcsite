<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PrintStore</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 30px;
    }

    h2 {
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: #fff;
      padding: 15px;
      border-radius: 14px;
      box-shadow: 0 10px 20px rgba(0,0,0,.08);
      transition: transform .2s;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .price {
      color: #2563eb;
      font-weight: bold;
      margin: 6px 0;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px;
      width: 100%;
      border-radius: 20px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

<h2>🖨 PrintStore</h2>

<div class="grid" id="products"></div>

<script src="store.js"></script>
</body>
</html>
